name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          # Falls back to GITHUB_TOKEN until a PAT secret exists.
          # A PAT is only needed to count private contributions.
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t">
<title id="t">Amp head with the name dio on the grille and knobs for consistency, drive, ownership, curiosity, grit, focus, craft and care, all turned up</title>
<defs>
  
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f2"/><stop offset=".5" stop-color="#a9abae"/><stop offset="1" stop-color="#e2e3e4"/></linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d9094"/><stop offset="1" stop-color="#3b3d40"/></linearGradient>
  <radialGradient id="knobSkirt" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3c3d40"/><stop offset="1" stop-color="#0c0c0d"/></radialGradient>
  <radialGradient id="knobCap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#55575b"/><stop offset="1" stop-color="#141415"/></radialGradient>
  <pattern id="tolex" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#17171a"/><circle cx="1.5" cy="1.5" r=".9" fill="#000" opacity=".6"/><circle cx="3.8" cy="3.6" r=".6" fill="#fff" opacity=".05"/></pattern>
  <pattern id="grille" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2a1d14"/><rect width="3" height="6" fill="#3d2a1b"/><rect width="6" height="1" fill="#b48a4a" opacity=".35"/>
  </pattern>
  <radialGradient id="grilleShade" cx=".5" cy=".4" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#d8cfbf"/><stop offset=".55" stop-color="#8a7f6c"/><stop offset="1" stop-color="#efe6d3"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc0"/><stop offset="1" stop-color="#cbb98f"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="logoClip"><text x="500" y="146" font-family="Georgia,'Times New Roman',serif" font-size="96" font-style="italic" font-weight="700" text-anchor="middle">dio</text></clipPath>
</defs>
<!-- handle -->
<rect x="410" y="6" width="180" height="26" rx="13" fill="#0e0e10" stroke="#2c2c30" stroke-width="2"/>
<rect x="392" y="22" width="26" height="16" rx="3" fill="url(#metal)"/><rect x="582" y="22" width="26" height="16" rx="3" fill="url(#metal)"/>
<!-- cabinet -->
<rect x="22" y="42" width="956" height="280" rx="20" fill="#000" opacity=".4" filter="url(#blur)"/>
<rect x="20" y="32" width="960" height="284" rx="20" fill="url(#tolex)"/>
<rect x="20" y="32" width="960" height="284" rx="20" fill="url(#sheen)"/>
<rect x="32" y="44" width="936" height="260" rx="12" fill="none" stroke="#d8c9a3" stroke-width="2.5" stroke-opacity=".85"/>
<!-- corners -->
<g transform="translate(20 32) rotate(0)"><path d="M0 34 V8 Q0 0 8 0 H34 L34 12 H12 V34 Z" fill="url(#metal)" stroke="#000" stroke-opacity=".4"/><circle cx="7" cy="7" r="2.5" fill="#555"/></g><g transform="translate(980 32) rotate(90)"><path d="M0 34 V8 Q0 0 8 0 H34 L34 12 H12 V34 Z" fill="url(#metal)" stroke="#000" stroke-opacity=".4"/><circle cx="7" cy="7" r="2.5" fill="#555"/></g><g transform="translate(980 316) rotate(180)"><path d="M0 34 V8 Q0 0 8 0 H34 L34 12 H12 V34 Z" fill="url(#metal)" stroke="#000" stroke-opacity=".4"/><circle cx="7" cy="7" r="2.5" fill="#555"/></g><g transform="translate(20 316) rotate(270)"><path d="M0 34 V8 Q0 0 8 0 H34 L34 12 H12 V34 Z" fill="url(#metal)" stroke="#000" stroke-opacity=".4"/><circle cx="7" cy="7" r="2.5" fill="#555"/></g>
<!-- grille -->
<rect x="54" y="62" width="892" height="140" rx="6" fill="url(#grille)"/>
<rect x="54" y="62" width="892" height="140" rx="6" fill="url(#grilleShade)"/>
<!-- logo -->
<text x="500" y="150" fill="#000" opacity=".55" font-family="Georgia,'Times New Roman',serif" font-size="96" font-style="italic" font-weight="700" text-anchor="middle">dio</text>
<text x="500" y="146" fill="url(#chrome)" stroke="#4a4234" stroke-width="1" font-family="Georgia,'Times New Roman',serif" font-size="96" font-style="italic" font-weight="700" text-anchor="middle">dio</text>
<g clip-path="url(#logoClip)"><rect x="300" y="60" width="60" height="120" fill="url(#shine)" transform="skewX(-20)">
  <animate attributeName="x" values="300;760;760" keyTimes="0;.35;1" dur="7s" repeatCount="indefinite"/>
</rect></g>
<text x="500" y="182" fill="#e6d6b0" fill-opacity=".85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="4" text-anchor="middle">FULL-STACK ENGINEER · WEB DEV · UP CEBU</text>
<!-- control panel -->
<rect x="54" y="214" width="892" height="88" rx="6" fill="url(#panel)" stroke="#000" stroke-opacity=".5"/>
<rect x="54" y="214" width="892" height="88" rx="6" fill="url(#sheen)"/>
<!-- input jacks -->
<circle cx="92" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/><circle cx="92" cy="262" r="6" fill="#111"/><text x="92" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">LO</text><circle cx="140" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/><circle cx="140" cy="262" r="6" fill="#111"/><text x="140" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">HI</text>

    <circle cx="215" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="215" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="215" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(120 215 262)"><rect x="213.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="215" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">CONSISTENCY</text>
    <circle cx="293" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="293" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="293" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(135 293 262)"><rect x="291.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="293" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">DRIVE</text>
    <circle cx="371" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="371" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="371" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(125 371 262)"><rect x="369.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="371" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">OWNERSHIP</text>
    <circle cx="449" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="449" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="449" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(110 449 262)"><rect x="447.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="449" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">CURIOSITY</text>
    <circle cx="527" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="527" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="527" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(130 527 262)"><rect x="525.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="527" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">GRIT</text>
    <circle cx="605" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="605" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="605" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(100 605 262)"><rect x="603.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="605" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">FOCUS</text>
    <circle cx="683" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="683" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="683" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(115 683 262)"><rect x="681.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="683" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">CRAFT</text>
    <circle cx="761" cy="264" r="19" fill="#000" opacity=".4"/>
    <circle cx="761" cy="262" r="19" fill="url(#knobSkirt)"/>
    <circle cx="761" cy="262" r="12" fill="url(#metal)" stroke="#000" stroke-opacity=".5"/>
    <g transform="rotate(128 761 262)"><rect x="759.7" y="244" width="2.6" height="9" rx="1.3" fill="#f4f1ea"/></g>
    <text x="761" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">CARE</text>
<!-- jewel + switch -->
<circle cx="862" cy="262" r="20" fill="#ff3b30" opacity=".4" filter="url(#glow)"><animate attributeName="opacity" values=".25;.6;.25" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="862" cy="262" r="12" fill="url(#metal)"/>
<circle cx="862" cy="262" r="8" fill="#ff3b30"/><circle cx="859.5" cy="259.5" r="2.5" fill="#fff" opacity=".85"/>
<text x="862" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">ON</text>
<rect x="902" y="248" width="16" height="28" rx="4" fill="#111"/><rect x="905" y="250" width="10" height="13" rx="2" fill="url(#metal)"/>
<text x="910" y="234" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" letter-spacing="1" text-anchor="middle">SHIP</text>
</svg>